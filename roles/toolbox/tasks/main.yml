---
- name: Configure Fedora toolbox (Silverblue)
  ansible.builtin.include_tasks: silverblue.yml
  when:
    - is_silverblue | default(false) | bool
    - configure_linux | default(false) | bool

- name: Configure declared toolboxes
  ansible.builtin.include_tasks: containers.yml
  when:
    - is_fedora | default(false) | bool
    - configure_linux | default(false) | bool
    - toolboxes | length > 0
