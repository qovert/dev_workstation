---
- name: Converge
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    - ../../default.config.yml

  vars:
    configure_dotfiles: false
    configure_linux: true
    configure_macos: false
    configure_mas: false
    configure_dock: false
    github_username: "test-user"
    # CI-safe subset: base Fedora repos only. External repo setup tasks
    # (Microsoft, RPM Fusion, Terra) are tagged molecule-notest and skipped,
    # so only packages available without those repos are listed here.
    fedora_packages:
      - btop
      - direnv
      - flatpak
      - gh
      - git
      - jq
      - ncdu
      - tree
      - vim
      - wget
      - zsh

  pre_tasks:
    - name: Set OS facts
      ansible.builtin.set_fact:
        is_macos: "{{ ansible_system == 'Darwin' }}"
        is_fedora: "{{ ansible_distribution == 'Fedora' }}"
        is_debian: "{{ ansible_os_family == 'Debian' }}"
        is_linux: "{{ ansible_system == 'Linux' }}"
        is_silverblue: false

  roles:
    - role: packages
    - role: system
