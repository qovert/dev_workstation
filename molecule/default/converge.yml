---
- name: Converge
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    - ../../default.config.yml

  vars:
    configure_dotfiles: false
    configure_linux: true
    configure_macos: false
    configure_mas: false
    configure_dock: false
    github_username: "test-user"
    # CI-safe subset: omit GUI desktop apps and third-party packages that are
    # unreliable or unavailable in the headless Docker test container.
    fedora_packages:
      - btop
      - direnv
      - flatpak
      - fuse-libs
      - gh
      - git
      - jq
      - ncdu
      - oh-my-posh
      - tree
      - vim
      - wget
      - yq
      - zsh

  pre_tasks:
    - name: Set OS facts
      ansible.builtin.set_fact:
        is_macos: "{{ ansible_system == 'Darwin' }}"
        is_fedora: "{{ ansible_distribution == 'Fedora' }}"
        is_debian: "{{ ansible_os_family == 'Debian' }}"
        is_linux: "{{ ansible_system == 'Linux' }}"
        is_silverblue: false

  roles:
    - role: packages
    - role: system
